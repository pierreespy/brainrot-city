<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Brainrot City</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #12141c; }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      #game-canvas { display: block; width: 100%; height: 100%; touch-action: none; }

      /* Couche UI : posée par-dessus le canvas, sans bloquer les clics. */
      #ui-layer {
        position: fixed; inset: 0; pointer-events: none;
        color: #fff; user-select: none;
      }
      #ui-layer .panel {
        position: absolute; top: 16px; left: 16px;
        background: rgba(0, 0, 0, 0.45);
        padding: 10px 14px; border-radius: 10px;
        font-size: 13px; line-height: 1.6;
        backdrop-filter: blur(4px);
      }
      #ui-layer kbd {
        background: rgba(255, 255, 255, 0.16); border-radius: 4px;
        padding: 1px 6px; font-family: inherit; font-size: 12px;
      }
    </style>
  </head>
  <body>
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer">
      <div class="panel">
        <strong>Brainrot City</strong> — Milestone 1<br />
        Déplacement : <kbd>ZQSD</kbd> / <kbd>WASD</kbd> / <kbd>flèches</kbd>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
