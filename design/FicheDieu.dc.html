<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Manrope, system-ui, sans-serif; }
    a { color: #7dd3fc; } a:hover { color: #bae6fd; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0e161a; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <div style="position: absolute; top: -110px; left: 50%; margin-left: -200px; width: 400px; height: 400px; border-radius: 50%; background: radial-gradient(circle, rgba(29,132,181,0.34) 0%, rgba(14,22,26,0) 70%); pointer-events: none;"></div>

  <div style="position: relative; display: flex; align-items: center; justify-content: space-between; padding: 56px 20px 0 20px;">
    <div style="width: 44px; height: 44px; border-radius: 22px; background: rgba(0,0,0,0.45); display: flex; align-items: center; justify-content: center;">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#efe9db" stroke-width="2" stroke-linecap="round"><path d="M14.5 5.5 8 12l6.5 6.5"></path></svg>
    </div>
    <div style="color: rgba(239,233,219,0.5); font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;">Panthéon</div>
    <div style="width: 44px;"></div>
  </div>

  <!-- Le dieu, en grand. La couleur du bloc EST son identité dans le jeu :
       c'est celle que portera sa silhouette sur la carte (M14). -->
  <div style="position: relative; text-align: center; padding: 26px 20px 0 20px;">
    <div style="width: 128px; height: 128px; border-radius: 34px; background: #1d84b5; margin: 0 auto; display: flex; align-items: center; justify-content: center;">
      <svg width="62" height="62" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="1.7" stroke-linecap="round">
        <path d="M6 13.5c2.4-1 4.2-1 6 0s3.6 1 6 0"></path>
        <path d="M12 4.5v6M9.4 7.1 12 4.5l2.6 2.6"></path>
        <path d="M7 17.5c2.2-.9 3.8-.9 5 0s3.3.9 5 0"></path>
      </svg>
    </div>
    <div style="margin-top: 16px; font-family: Cinzel, Georgia, serif; font-size: 30px; font-weight: 700; color: #efe9db; letter-spacing: 1.6px;">Hermès</div>
    <div style="margin-top: 4px; color: rgba(239,233,219,0.5); font-size: 12px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase;">Voyageurs et messagers</div>
  </div>

  <div style="position: relative; padding: 26px 20px 0 20px;">

    <div style="padding: 16px; border-radius: 16px; background: rgba(0,0,0,0.45); border: 1px solid rgba(125,211,252,0.35);">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 9px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7dd3fc" stroke-width="1.9" stroke-linejoin="round"><path d="M13 3 5.5 13.5H11L10 21l7.5-10.5H12z"></path></svg>
          <span style="font-family: Cinzel, Georgia, serif; font-size: 18px; font-weight: 700; color: #efe9db;">Talaria</span>
        </div>
        <span style="color: rgba(239,233,219,0.5); font-size: 11px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;">Capacité</span>
      </div>
      <div style="margin-top: 9px; color: rgba(239,233,219,0.72); font-size: 13px; font-weight: 500; line-height: 1.45;">Sprint : +80 % de vitesse, le cortège suit sans se disloquer.</div>
      <div style="margin-top: 13px; display: flex; gap: 9px;">
        <div style="flex-grow: 1; padding: 10px 12px; border-radius: 11px; background: rgba(239,233,219,0.06);">
          <div style="color: rgba(239,233,219,0.5); font-size: 10px; font-weight: 700; letter-spacing: 0.9px; text-transform: uppercase;">Durée</div>
          <div style="margin-top: 3px; color: #efe9db; font-size: 17px; font-weight: 800;">3 s</div>
        </div>
        <div style="flex-grow: 1; padding: 10px 12px; border-radius: 11px; background: rgba(239,233,219,0.06);">
          <div style="color: rgba(239,233,219,0.5); font-size: 10px; font-weight: 700; letter-spacing: 0.9px; text-transform: uppercase;">Recharge</div>
          <div style="margin-top: 3px; color: #efe9db; font-size: 17px; font-weight: 800;">12 s</div>
        </div>
      </div>
    </div>

    <div style="margin-top: 24px; display: flex; align-items: baseline; justify-content: space-between;">
      <span style="color: rgba(239,233,219,0.5); font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase;">Apparences</span>
      <span style="color: rgba(239,233,219,0.4); font-size: 11px; font-weight: 700;">1 / 3</span>
    </div>

    <div style="margin-top: 11px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px;">

      <div style="padding: 12px 10px; border-radius: 14px; background: rgba(0,0,0,0.45); border: 1px solid #7dd3fc; text-align: center;">
        <div style="width: 44px; height: 44px; border-radius: 13px; background: #1d84b5; margin: 0 auto;"></div>
        <div style="margin-top: 9px; color: #efe9db; font-size: 12px; font-weight: 700;">Classique</div>
        <div style="margin-top: 3px; color: #7dd3fc; font-size: 10px; font-weight: 800; letter-spacing: 0.7px;">ÉQUIPÉ</div>
      </div>

      <div style="padding: 12px 10px; border-radius: 14px; background: rgba(0,0,0,0.45); text-align: center; opacity: 0.55;">
        <div style="width: 44px; height: 44px; border-radius: 13px; background: #7dd3fc; margin: 0 auto;"></div>
        <div style="margin-top: 9px; color: #efe9db; font-size: 12px; font-weight: 700;">Ailé</div>
        <div style="margin-top: 3px; color: #fde047; font-size: 11px; font-weight: 800;">600</div>
      </div>

      <div style="padding: 12px 10px; border-radius: 14px; background: rgba(0,0,0,0.45); text-align: center; opacity: 0.55;">
        <div style="width: 44px; height: 44px; border-radius: 13px; background: #c4694a; margin: 0 auto;"></div>
        <div style="margin-top: 9px; color: #efe9db; font-size: 12px; font-weight: 700;">Terracotta</div>
        <div style="margin-top: 3px; color: #fde047; font-size: 11px; font-weight: 800;">600</div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="position: relative; padding: 0 20px 34px 20px;">
    <div style="height: 58px; border-radius: 16px; background: #7dd3fc; display: flex; align-items: center; justify-content: center;">
      <span style="font-family: Cinzel, Georgia, serif; font-size: 18px; font-weight: 700; color: #0e161a; letter-spacing: 2.4px;">CHOISIR HERMÈS</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
